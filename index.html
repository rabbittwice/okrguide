<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OKR Planner</title><style>
:root{--b:#1a73e8;--i:#202124;--s:#5f6368;--l:#dadce0;--bg:#f8fafd;--c:#fff;--soft:#eef4ff}html[data-theme=dark]{--i:#e8eaed;--s:#bdc1c6;--l:#5f6368;--bg:#202124;--c:#292a2d;--soft:#283b5c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font:14px Arial,"Noto Sans KR",sans-serif}.wrap{width:min(1050px,calc(100% - 32px));margin:auto}header{background:var(--c);border-bottom:1px solid var(--l)}.nav{height:68px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:bold}.brand b{background:var(--b);color:#fff;padding:6px 9px;border-radius:6px;margin-right:8px}.tool,.btn{padding:9px 12px;border:1px solid var(--l);border-radius:5px;background:var(--c);color:var(--i);cursor:pointer}.btn{background:var(--b);color:#fff;border-color:var(--b)}.tools,.filters,.move{display:flex;gap:7px}main{padding:42px 0}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:26px}.hero h1{font-size:34px;margin:0 0 8px}.hero p,.notice{color:var(--s)}.filters{margin-bottom:15px}.filter.on{background:var(--soft);color:var(--b);border-color:var(--b)}.list{display:grid;gap:13px}.card,.empty{background:var(--c);border:1px solid var(--l);border-radius:10px}.card{position:relative;padding:22px}.card.done{opacity:.65}.card.done h2{text-decoration:line-through}.empty{text-align:center;padding:65px}.meta{font-size:12px;color:var(--s)}.badge{color:var(--b);background:var(--soft);padding:3px 7px;border-radius:12px}.card h2{margin:12px 45px 16px 0}.more{position:absolute;right:12px;top:10px;border:0;background:transparent;color:var(--s);font-size:23px}.menu{display:none;position:absolute;right:13px;top:44px;z-index:2;background:var(--c);border:1px solid var(--l);border-radius:6px;padding:4px}.menu.show{display:block}.menu button{display:block;width:100%;border:0;background:transparent;color:var(--i);padding:8px;text-align:left}.krs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.kr{background:var(--soft);border:1px solid var(--l);border-radius:6px;padding:12px;color:var(--i);display:flex;flex-direction:column;justify-content:space-between;gap:8px;transition:background .2s,border-color .2s}.kr.done{background:#e8f0fe;border-color:var(--b)}html[data-theme=dark] .kr.done{background:#23334d;border-color:var(--b)}.kr-top{display:flex;justify-content:space-between;align-items:center}.kr b{color:var(--b);font-size:11px}.kr-btn{padding:3px 8px;font-size:11px;border:1px solid var(--l);border-radius:4px;background:var(--c);color:var(--s);cursor:pointer;transition:all .15s}.kr-btn.on{background:var(--b);color:#fff;border-color:var(--b);font-weight:bold}.kr-text{margin:0;font-size:13px;line-height:1.4;word-break:break-word}.kr.done .kr-text{color:var(--s);text-decoration:line-through}.mot{margin-top:12px;padding-top:12px;border-top:1px solid var(--l);color:var(--s)}.back{display:none;position:fixed;inset:0;z-index:5;background:#0008;padding:20px;place-items:center}.back.open{display:grid}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:var(--c);padding:23px;border-radius:10px}.field{margin:14px 0}.field label{display:block;font-weight:bold;margin-bottom:6px}input,textarea{width:100%;padding:10px;border:1px solid var(--l);background:var(--c);color:var(--i);border-radius:4px}textarea{min-height:70px}.period,.krsform{display:grid;grid-template-columns:1fr 1fr;gap:8px}.presets{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}.preset{padding:4px 9px;font-size:12px;border:1px solid var(--l);border-radius:4px;background:var(--soft);color:var(--b);cursor:pointer;font-weight:500;transition:all .15s}.preset:hover{background:var(--b);color:#fff}.foot{display:flex;justify-content:flex-end;gap:7px;margin-top:20px}.pick{display:block;padding:10px;border-bottom:1px solid var(--l)}@media(max-width:650px){.nav{height:auto;padding:12px 0;flex-wrap:wrap;gap:10px}.tools{flex-wrap:wrap}.hero{display:block}.hero .btn{width:100%;margin-top:18px}.krs{grid-template-columns:1fr}.empty{padding:40px 15px}.card{padding:17px}}
</style></head><body><header><div class="wrap nav"><div class="brand"><b>✓</b>OKR Planner</div><div class="tools"><button class="tool" id="exp">⤓ <span id="expt">내보내기</span></button><button class="tool" id="imp">⤒ <span id="impt">가져오기</span></button><input type="file" id="file" accept=".json" style="display:none"><button class="tool" id="wall">▣ Wallpaper</button><button class="tool" id="lang">EN / 한</button><button class="tool" id="theme">☾</button></div></div></header><main class="wrap"><div class="hero"><div><h1 id="title">목표를 명확하게, 실행은 가볍게.</h1><p id="desc">나의 OKR을 살펴보고 다음 행동을 이어가세요.</p></div><button class="btn" id="new">＋ <span id="newt">새 OKR 만들기</span></button></div><div class="filters"><button class="tool filter on" data-f="all" id="all">전체 보기</button><button class="tool filter" data-f="active" id="active">미완료 보기</button></div><section class="list" id="list"></section><p class="notice" id="notice">모든 데이터는 현재 사용 중인 기기에 저장되며, JSON 파일로 다른 기기에 옮길 수 있습니다.</p></main>
<div class="back" id="edit"><form class="modal" id="form"><h2 id="ft">새 OKR 만들기</h2><input name="id" type="hidden"><div class="field"><label id="period">목표 기간</label><div class="period"><input name="startDate" type="date" required><input name="endDate" type="date" required></div><div class="presets"><button type="button" class="preset" data-p="1d">1일</button><button type="button" class="preset" data-p="1w">일주일</button><button type="button" class="preset" data-p="1m">1개월</button><button type="button" class="preset" data-p="3m">3개월</button><button type="button" class="preset" data-p="1y">1년</button></div></div><div class="field"><label id="obj">O · 어떤 목표를 만들고 싶나요?</label><textarea name="objective" required></textarea></div><div class="field"><label id="krlabel">KR · 세부 목표 3가지</label><input name="kr1" required><br><br><input name="kr2" required><br><br><input name="kr3" required></div><div class="field"><label id="motlabel">이 목표를 세운 동기</label><textarea name="motivation" required></textarea></div><div class="foot"><button class="tool" type="button" data-close>취소</button><button class="btn">저장</button></div></form></div><div class="back" id="picker"><div class="modal"><h2 id="wt">배경화면 저장</h2><p id="wp">OKR을 1~5개 선택하세요.</p><div id="picks"></div><div class="foot"><button class="tool" data-close>취소</button><button class="btn" id="down">PNG 저장</button></div></div></div><div class="back" id="imp-modal"><div class="modal" style="max-width:440px"><h2 id="imptit">데이터 가져오기</h2><p id="impdesc" style="color:var(--s);margin:10px 0 20px">불러온 데이터를 기존 목록에 어떻게 반영할까요?</p><div class="foot" style="justify-content:space-between"><button class="tool" data-close type="button">취소</button><div style="display:flex;gap:8px"><button class="tool" id="imp-append" type="button">＋ 추가하기</button><button class="btn" id="imp-replace" type="button">덮어씌우기</button></div></div></div></div>
<script>
const $=s=>document.querySelector(s),key='okr-planner-goals';let lang=localStorage.okrLang||'ko',filter='all';const tx={ko:['목표를 명확하게, 실행은 가볍게.','나의 OKR을 살펴보고 다음 행동을 이어가세요.','새 OKR 만들기','전체 보기','미완료 보기','모든 데이터는 현재 사용 중인 기기에 저장되며, JSON 파일로 다른 기기에 옮길 수 있습니다.','목표 기간','O · 어떤 목표를 만들고 싶나요?','KR · 세부 목표 3가지','이 목표를 세운 동기','저장','취소','배경화면 저장','OKR을 1~5개 선택하세요.','내보내기','가져오기','데이터 가져오기','불러온 데이터를 기존 목록에 어떻게 반영할까요?','덮어씌우기','＋ 추가하기'],en:['Make goals clear. Keep action simple.','Review your OKRs and take your next action.','Create OKR','All','Active','All data is stored on this device and can be transferred via JSON file.','Goal period','O · What do you want to achieve?','KR · Three key results','Why this goal?','Save','Cancel','Save wallpaper','Select 1–5 OKRs.','Export','Import','Import Data','How would you like to apply the imported data?','Overwrite','＋ Append']};const presetTx={ko:['1일','일주일','1개월','3개월','1년'],en:['1 Day','1 Week','1 Month','3 Months','1 Year']};const T=i=>tx[lang][i],get=()=>JSON.parse(localStorage.getItem(key)||'[]'),put=x=>localStorage.setItem(key,JSON.stringify(x)),done=g=>(g.done||[]).length===3&&(g.done||[]).every(Boolean),esc=x=>String(x).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function words(){['title','desc','newt','all','active','notice','period','obj','krlabel','motlabel'].forEach((id,i)=>$('#'+id).textContent=T(i));document.querySelectorAll('[data-close]').forEach(x=>x.textContent=T(11));$('#wall').textContent='▣ '+T(12);$('#wt').textContent=T(12);$('#wp').textContent=T(13);$('#expt').textContent=T(14);$('#impt').textContent=T(15);$('#imptit').textContent=T(16);$('#impdesc').textContent=T(17);$('#imp-replace').textContent=T(18);$('#imp-append').textContent=T(19);document.querySelectorAll('.preset').forEach((b,i)=>b.textContent=presetTx[lang][i]);render()}function render(){let a=get().filter(g=>filter==='all'||!done(g)),l=$('#list');if(!a.length){l.innerHTML='<div class="empty"><h2>✦ '+(lang==='ko'?'첫 번째 목표를 만들어 보세요':'Create your first goal')+'</h2><button class="btn" data-new>'+T(2)+'</button></div>';return}l.innerHTML=a.map(g=>`<article class="card ${done(g)?'done':''}" data-id="${g.id}"><button class="more" data-more="${g.id}">⋮</button><div class="menu" id="m${g.id}"><button data-edit="${g.id}">Edit</button><button data-copy="${g.id}">Duplicate</button><button data-del="${g.id}">Delete</button></div><div class="meta"><span class="badge">${done(g)?'DONE':'OKR'}</span> ${g.startDate} – ${g.endDate}</div><h2>${esc(g.objective)}</h2><div class="krs">${g.krs.map((v,i)=>`<div class="kr ${g.done?.[i]?'done':''}"><div class="kr-top"><b>KEY RESULT ${i+1}</b><button type="button" class="kr-btn ${g.done?.[i]?'on':''}" data-check="${g.id}:${i}">${g.done?.[i]?(lang==='ko'?'✓ 완료':'✓ Done'):(lang==='ko'?'미완료':'To Do')}</button></div><p class="kr-text">${esc(v)}</p></div>`).join('')}</div><div class="mot">Why · ${esc(g.motivation)}</div><div class="move"><button class="tool" data-up="${g.id}">↑</button><button class="tool" data-down="${g.id}">↓</button></div></article>`).join('')}
function open(g,copy){let f=$('#form');f.reset();f.id.value=copy?'':g?.id||'';let today=new Date().toLocaleDateString('sv');f.startDate.value=g?g.startDate:today;f.endDate.value=g?g.endDate:today;if(g){f.objective.value=g.objective;[f.kr1.value,f.kr2.value,f.kr3.value]=g.krs;f.motivation.value=g.motivation}$('#ft').textContent=g&&!copy?'Edit OKR':T(2);$('#edit').classList.add('open')}$('#new').onclick=()=>open();$('#lang').onclick=()=>{lang=lang==='ko'?'en':'ko';localStorage.okrLang=lang;words()};$('#theme').onclick=()=>{let d=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=d;localStorage.okrTheme=d};document.documentElement.dataset.theme=localStorage.okrTheme||'light';document.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>x.closest('.back').classList.remove('open'));
$('#form').onsubmit=e=>{e.preventDefault();let f=e.target,a=get(),g={id:f.id.value||Date.now(),startDate:f.startDate.value,endDate:f.endDate.value,objective:f.objective.value,krs:[f.kr1.value,f.kr2.value,f.kr3.value],motivation:f.motivation.value,done:[]},i=a.findIndex(x=>String(x.id)===String(g.id));if(i<0)a.unshift(g);else{g.done=a[i].done||[];a[i]=g}put(a);$('#edit').classList.remove('open');render()};$('#list').onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.check){let [id,n]=b.dataset.check.split(':'),a=get(),g=a.find(x=>String(x.id)===id);g.done??=[];g.done[n]=!g.done[n];put(a);render();return}if('new'in b.dataset)return open();let id=Object.values(b.dataset)[0],a=get(),i=a.findIndex(x=>String(x.id)===String(id)),g=a[i];if(b.dataset.more)return $('#m'+id).classList.toggle('show');if(b.dataset.edit)open(g);if(b.dataset.copy)open(g,true);if(b.dataset.del){a.splice(i,1);put(a);render()}if(b.dataset.up&&i>0){[a[i-1],a[i]]=[a[i],a[i-1]];put(a);render()}if(b.dataset.down&&i<a.length-1){[a[i+1],a[i]]=[a[i],a[i+1]];put(a);render()}};document.querySelector('.filters').onclick=e=>{if(!e.target.dataset.f)return;filter=e.target.dataset.f;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('on',x.dataset.f===filter));render()};
$('#wall').onclick=()=>{let a=get();if(!a.length)return;$('#picks').innerHTML=a.map(g=>'<label class="pick"><input type="checkbox" value="'+g.id+'"> '+esc(g.objective)+'</label>').join('');$('#picker').classList.add('open')};$('#down').onclick=()=>{let ids=[...document.querySelectorAll('#picks input:checked')].map(x=>x.value);if(!ids.length||ids.length>5)return alert('1~5개를 선택해 주세요.');let a=get().filter(g=>ids.includes(String(g.id))),c=document.createElement('canvas'),x=c.getContext('2d');c.width=1920;c.height=1080;x.fillStyle='#f5f8ff';x.fillRect(0,0,1920,1080);x.fillStyle='#1a73e8';x.font='bold 48px sans-serif';x.fillText('MY OKR',120,110);a.forEach((g,i)=>{let y=180+i*175;x.fillStyle='#fff';x.fillRect(100,y,1720,145);x.fillStyle='#202124';x.font='bold 31px sans-serif';x.fillText(g.objective.slice(0,55),140,y+47);if(g.startDate&&g.endDate){x.fillStyle='#5f6368';x.font='20px sans-serif';x.textAlign='right';x.fillText(g.startDate+' – '+g.endDate,1780,y+47);x.textAlign='left'}x.font='22px sans-serif';x.fillStyle='#1a73e8';x.fillText(g.krs.map((k,n)=>'KR'+(n+1)+': '+k).join('  ·  ').slice(0,130),140,y+96)});let l=document.createElement('a');l.href=c.toDataURL();let d=new Date(),ds=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');l.download=ds+'_OKR.png';l.click();$('#picker').classList.remove('open')};let tempImport=[];$('#exp').onclick=()=>{let d=new Date(),ds=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'),b=new Blob([JSON.stringify(get(),null,2)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download=ds+'_OKR_backup.json';l.click();URL.revokeObjectURL(u)};$('#imp').onclick=()=>$('#file').click();$('#file').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{try{let d=JSON.parse(ev.target.result);if(!Array.isArray(d))throw 0;tempImport=d;$('#imp-modal').classList.add('open')}catch(x){alert(lang==='ko'?'올바른 JSON 파일이 아닙니다.':'Invalid JSON file.')}e.target.value=''};r.readAsText(f)};$('#imp-replace').onclick=()=>{put(tempImport);render();$('#imp-modal').classList.remove('open');alert(lang==='ko'?'성공적으로 덮어씌웠습니다.':'Data replaced successfully.')};$('#imp-append').onclick=()=>{let cur=get(),exist=new Set(cur.map(x=>String(x.id)));tempImport.forEach(item=>{if(exist.has(String(item.id)))item.id=Date.now()+Math.random();cur.push(item)});put(cur);render();$('#imp-modal').classList.remove('open');alert(lang==='ko'?'성공적으로 추가되었습니다.':'Data appended successfully.')};document.querySelectorAll('.preset').forEach(b=>{b.onclick=()=>{let f=$('#form'),sVal=f.startDate.value||new Date().toLocaleDateString('sv');f.startDate.value=sVal;let [y,m,d]=sVal.split('-').map(Number),dt=new Date(y,m-1,d);let p=b.dataset.p;if(p==='1w')dt.setDate(dt.getDate()+7);else if(p==='1m')dt.setMonth(dt.getMonth()+1);else if(p==='3m')dt.setMonth(dt.getMonth()+3);else if(p==='1y')dt.setFullYear(dt.getFullYear()+1);f.endDate.value=dt.toLocaleDateString('sv')}});words();
</script></body></html>

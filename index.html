<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OKR Planner</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap');
:root{--blue:#1a73e8;--blue-soft:#e8f0fe;--ink:#202124;--sub:#5f6368;--line:#dadce0;--bg:#f8fafd;--card:#fff;--red:#d93025;--green:#188038;--shadow:0 1px 2px #3c40431f}html[data-theme=dark]{--ink:#e8eaed;--sub:#bdc1c6;--line:#5f6368;--bg:#202124;--card:#292a2d;--blue-soft:#283b5c;--shadow:0 1px 3px #0008}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Roboto,"Noto Sans KR",sans-serif}.wrap{width:min(1120px,calc(100% - 40px));margin:auto}header{height:72px;background:var(--card);border-bottom:1px solid var(--line)}.nav{height:100%;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:500}.logo{width:30px;height:30px;display:grid;place-items:center;background:var(--blue);color:#fff;border-radius:7px;font-weight:700}.brand span{color:var(--blue)}.nav-tools{display:flex;gap:8px;align-items:center}.toggle,.text-btn{background:transparent;color:var(--sub);border:1px solid var(--line);border-radius:5px;padding:8px 10px;font-size:13px}.toggle:hover,.text-btn:hover{background:var(--blue-soft);color:var(--blue)}main{padding:48px 0 70px}.hero{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:34px}.hero h1{font-size:clamp(30px,4vw,42px);letter-spacing:-1.7px;font-weight:500;margin:0 0 12px}.hero p{color:var(--sub);font-family:"Noto Sans KR",sans-serif;margin:0;line-height:1.6;font-size:15px}.primary{background:var(--blue);color:#fff;border:0;border-radius:4px;padding:12px 17px;font-weight:500;box-shadow:var(--shadow);white-space:nowrap}.primary:hover{background:#1765cc}.goal-list{display:grid;gap:14px}.empty{padding:74px 20px;background:var(--card);border:1px dashed var(--line);border-radius:12px;text-align:center}.empty-icon{font-size:35px;color:var(--blue);margin-bottom:13px}.empty h2{font-size:20px;font-weight:500;margin:0 0 8px}.empty p{color:var(--sub);font-family:"Noto Sans KR",sans-serif;line-height:1.6;margin:0 0 20px}.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:25px;box-shadow:var(--shadow)}.meta{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:12px;margin-bottom:11px}.badge{background:var(--blue-soft);color:var(--blue);border-radius:20px;padding:4px 8px;font-weight:500}.card h2{max-width:calc(100% - 165px);font-size:21px;font-weight:500;letter-spacing:-.6px;margin:0 0 18px}.actions{position:absolute;right:15px;top:15px;display:flex;gap:2px}.action{border:0;background:transparent;color:var(--blue);padding:8px;border-radius:4px;font-size:13px}.action:hover{background:var(--blue-soft)}.action.delete{color:var(--red)}.krs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kr{padding:13px;background:color-mix(in srgb,var(--blue-soft) 35%,var(--card));border-radius:6px}.kr b{display:block;color:var(--blue);font-size:11px;margin-bottom:6px}.kr p{margin:0;font-family:"Noto Sans KR",sans-serif;font-size:13px;line-height:1.5}.motivation{margin-top:15px;padding-top:14px;border-top:1px solid var(--line);color:var(--sub);font-family:"Noto Sans KR",sans-serif;line-height:1.6}.motivation b{color:var(--ink);font-family:Roboto,"Noto Sans KR";margin-right:7px}.backdrop{position:fixed;inset:0;display:none;place-items:center;padding:20px;background:#2021248c;z-index:5}.backdrop.open{display:grid}.modal{width:min(690px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--card);border-radius:12px;box-shadow:0 16px 45px #0005}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:23px 26px 18px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:21px;font-weight:500}.close{border:0;background:transparent;color:var(--sub);font-size:24px;padding:2px 7px}.form{padding:23px 26px}.field{margin-bottom:19px}.field label{display:block;margin-bottom:8px;font-weight:500}.req{color:var(--red)}input,textarea{width:100%;padding:12px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:5px;font:inherit;outline:0}input:focus,textarea:focus{border:2px solid var(--blue);padding:11px;box-shadow:0 0 0 1px var(--blue)}textarea{min-height:84px;resize:vertical}.period{display:grid;grid-template-columns:1fr 1fr;gap:10px}.period label{font-size:12px;color:var(--sub)}.kr-input{display:flex;align-items:center;gap:9px;margin:8px 0}.num{width:24px;height:24px;display:grid;place-items:center;flex:0 0 auto;background:var(--blue-soft);color:var(--blue);border-radius:50%;font-size:12px;font-weight:700}.form-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:25px}.cancel{border:0;background:transparent;color:var(--blue);padding:11px 15px}.notice{color:var(--sub);text-align:center;margin-top:22px;font-size:12px}@media(max-width:640px){.wrap{width:min(100% - 28px,1120px)}main{padding-top:32px}.hero{align-items:start;flex-direction:column}.primary{width:100%}.storage{display:none}.card h2{max-width:100%;padding-top:36px}.krs,.period{grid-template-columns:1fr}.actions{right:10px;top:10px}.modal-head,.form{padding-left:19px;padding-right:19px}.nav-tools .toggle{padding:8px}.lang-label{display:none}}@media print{@page{size:A4;margin:16mm}header,.hero,.notice,.actions,.backdrop{display:none!important}main{padding:0}.card{display:none;border:0;box-shadow:none}.card.printing{display:block}.card h2{max-width:none}.goal-list{display:block}.krs{gap:12px}.kr{border:1px solid #ddd;background:#fff;color:#202124}.motivation{color:#202124}}
</style>
</head>
<body>
<header><div class="wrap nav"><div class="brand"><div class="logo">✓</div>OKR <span>Planner</span></div><div class="nav-tools"><button class="toggle" id="lang"><span class="lang-label">EN</span> 한/EN</button><button class="toggle" id="theme">☾ <span id="theme-name">Dark</span></button></div></div></header>
<main class="wrap"><section class="hero"><div><h1 id="heading"></h1><p id="subheading"></p></div><button class="primary" id="create">＋ <span id="create-label"></span></button></section><section class="goal-list" id="goals"></section><p class="notice" id="notice"></p></main>
<div class="backdrop" id="modal"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2 id="modal-title"></h2><button class="close" id="close" aria-label="Close">×</button></div><form class="form" id="form"><input type="hidden" name="id"><div class="field"><label id="period-label"></label><div class="period"><label id="start-label"><span></span><input name="startDate" type="date" required></label><label id="end-label"><span></span><input name="endDate" type="date" required></label></div></div><div class="field"><label id="objective-label"></label><textarea name="objective" required></textarea></div><div class="field"><label id="kr-label"></label><div class="kr-input"><span class="num">1</span><input name="kr1" required></div><div class="kr-input"><span class="num">2</span><input name="kr2" required></div><div class="kr-input"><span class="num">3</span><input name="kr3" required></div></div><div class="field"><label id="motivation-label"></label><textarea name="motivation" required></textarea></div><div class="form-footer"><button type="button" class="cancel" id="cancel"></button><button class="primary" id="save" type="submit"></button></div></form></section></div>
<script>
const $=s=>document.querySelector(s),key='okr-planner-goals',state={lang:localStorage.getItem('okr-lang')||'ko',theme:localStorage.getItem('okr-theme')||'light'};
const t={ko:{heading:'목표를 명확하게, 실행은 가볍게.',sub:'내가 만든 OKR을 한곳에서 살펴보고 다음 행동을 이어가세요.',create:'새 OKR 만들기',emptyTitle:'당신의 첫 번째 목표를 기다리고 있어요',emptySub:'작고 선명한 목표 하나가 큰 변화를 만듭니다. 지금 이번 기간의 OKR을 작성해 보세요.',emptyBtn:'첫 OKR 만들기',count:'개의 목표',period:'목표 기간',start:'시작일',end:'종료일',objective:'O · 어떤 목표를 만들고 싶나요?',kr:'KR · 목표를 이루기 위한 세부 목표 3가지',motivation:'이 목표를 세운 동기는 무엇인가요?',newTitle:'새 OKR 만들기',editTitle:'OKR 편집하기',save:'저장하기',cancel:'취소',edit:'편집',copy:'복제',print:'인쇄',delete:'삭제',reason:'목표를 세운 동기',notice:'모든 데이터는 현재 사용 중인 기기에만 저장됩니다.',dark:'다크',light:'화이트',deleteConfirm:'이 OKR을 삭제할까요?',dateError:'종료일은 시작일 이후로 선택해 주세요.'},en:{heading:'Make goals clear. Keep action simple.',sub:'Review your OKRs in one place and keep moving toward your next step.',create:'Create OKR',emptyTitle:'Your first goal is waiting',emptySub:'One small, clear goal can make a big change. Start writing an OKR for this period.',emptyBtn:'Create your first OKR',count:' goals',period:'Goal period',start:'Start date',end:'End date',objective:'O · What do you want to achieve?',kr:'KR · Three key results to achieve it',motivation:'Why did you set this goal?',newTitle:'Create new OKR',editTitle:'Edit OKR',save:'Save',cancel:'Cancel',edit:'Edit',copy:'Duplicate',print:'Print',delete:'Delete',reason:'Why this goal',notice:'All data is stored only on this device.',dark:'Dark',light:'Light',deleteConfirm:'Delete this OKR?',dateError:'The end date must be after the start date.'}};
const tr=k=>t[state.lang][k],esc=v=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),goals=()=>JSON.parse(localStorage.getItem(key)||'[]'),setGoals=x=>localStorage.setItem(key,JSON.stringify(x));
function date(v){return new Intl.DateTimeFormat(state.lang==='ko'?'ko-KR':'en-US',{year:'numeric',month:'short',day:'numeric'}).format(new Date(v+'T00:00:00'))}function text(){document.documentElement.lang=state.lang;document.documentElement.dataset.theme=state.theme;$('#heading').textContent=tr('heading');$('#subheading').textContent=tr('sub');$('#create-label').textContent=tr('create');$('#notice').textContent=tr('notice');$('#theme-name').textContent=tr(state.theme==='light'?'dark':'light');$('#period-label').textContent=tr('period');$('#start-label').childNodes[0].textContent=tr('start');$('#end-label').childNodes[0].textContent=tr('end');$('#objective-label').textContent=tr('objective');$('#kr-label').textContent=tr('kr');$('#motivation-label').textContent=tr('motivation');$('#cancel').textContent=tr('cancel');render()}
function render(){let x=goals(),out=$('#goals');if(!x.length){out.innerHTML=`<div class="empty"><div class="empty-icon">✦</div><h2>${tr('emptyTitle')}</h2><p>${tr('emptySub')}</p><button class="primary" data-new>${tr('emptyBtn')}</button></div>`;return}out.innerHTML=x.map(g=>`<article class="card" data-id="${g.id}"><div class="actions"><button class="action" data-edit="${g.id}">✎ ${tr('edit')}</button><button class="action" data-copy="${g.id}">⧉ ${tr('copy')}</button><button class="action" data-print="${g.id}">🖨 ${tr('print')}</button><button class="action delete" data-delete="${g.id}">${tr('delete')}</button></div><div class="meta"><span class="badge">OKR</span><span>${date(g.startDate)} – ${date(g.endDate)}</span></div><h2>${esc(g.objective)}</h2><div class="krs">${g.krs.map((v,i)=>`<div class="kr"><b>KEY RESULT ${i+1}</b><p>${esc(v)}</p></div>`).join('')}</div><div class="motivation"><b>${tr('reason')}</b>${esc(g.motivation)}</div></article>`).join('')}
function open(goal,copy=false){let f=$('#form');f.reset();f.elements.id.value=copy?'':goal?.id||'';if(goal){f.startDate.value=goal.startDate;f.endDate.value=goal.endDate;f.objective.value=goal.objective;[f.kr1.value,f.kr2.value,f.kr3.value]=goal.krs;f.motivation.value=goal.motivation}$('#modal-title').textContent=goal&&!copy?tr('editTitle'):tr('newTitle');$('#save').textContent=tr('save');$('#modal').classList.add('open');f.objective.focus()}
$('#create').onclick=()=>open();$('#close').onclick=$('#cancel').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('open')};$('#lang').onclick=()=>{state.lang=state.lang==='ko'?'en':'ko';localStorage.setItem('okr-lang',state.lang);text()};$('#theme').onclick=()=>{state.theme=state.theme==='light'?'dark':'light';localStorage.setItem('okr-theme',state.theme);text()};
$('#form').onsubmit=e=>{e.preventDefault();let f=e.currentTarget;if(f.endDate.value<f.startDate.value)return alert(tr('dateError'));let all=goals(),g={id:f.elements.id.value||Date.now(),startDate:f.startDate.value,endDate:f.endDate.value,objective:f.objective.value,krs:[f.kr1.value,f.kr2.value,f.kr3.value],motivation:f.motivation.value},i=all.findIndex(x=>String(x.id)===String(g.id));i<0?all.unshift(g):all[i]=g;setGoals(all);$('#modal').classList.remove('open');render()};
$('#goals').onclick=e=>{let b=e.target.closest('button');if(!b)return;let id=b.dataset.edit||b.dataset.copy||b.dataset.print||b.dataset.delete,g=goals().find(x=>String(x.id)===id);if(b.dataset.edit)open(g);if(b.dataset.copy)open(g,true);if(b.dataset.print){let c=$('[data-id="'+id+'"]');c.classList.add('printing');print();c.classList.remove('printing')}if(b.dataset.delete&&confirm(tr('deleteConfirm'))){setGoals(goals().filter(x=>String(x.id)!==id));render()}if('new' in b.dataset)open()};
text();
</script></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OKR 플래너</title><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');:root{--b:#1a73e8;--bs:#e8f0fe;--i:#202124;--s:#5f6368;--l:#dadce0;--bg:#f8fafd;--c:#fff;--r:#d93025}html[data-theme=dark]{--i:#e8eaed;--s:#bdc1c6;--l:#5f6368;--bg:#202124;--c:#292a2d;--bs:#283b5c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font:14px "Noto Sans KR",sans-serif}.wrap{width:min(1100px,calc(100% - 36px));margin:auto}header{height:70px;background:var(--c);border-bottom:1px solid var(--l)}.nav{height:100%;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:700}.brand b{display:inline-grid;place-items:center;width:29px;height:29px;background:var(--b);color:#fff;border-radius:7px;margin-right:9px}.tools{display:flex;gap:7px}button{cursor:pointer;font:inherit}.btn,.tool{border:0;border-radius:5px;padding:10px 13px}.btn{background:var(--b);color:#fff}.tool{background:var(--c);color:var(--s);border:1px solid var(--l)}main{padding:44px 0 65px}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:30px}.hero h1{font-size:36px;margin:0 0 9px;letter-spacing:-1.5px}.hero p{margin:0;color:var(--s)}.filters{display:flex;gap:8px;margin-bottom:16px}.filter.on{background:var(--bs);color:var(--b);border-color:var(--b)}.list{display:grid;gap:14px}.empty,.card{background:var(--c);border:1px solid var(--l);border-radius:12px}.empty{text-align:center;padding:70px 20px}.empty h2{font-size:20px}.empty p{color:var(--s);margin-bottom:22px}.card{position:relative;padding:23px}.card.done{opacity:.68}.card.done h2{text-decoration:line-through}.meta{color:var(--s);font-size:12px;margin-bottom:10px}.badge{background:var(--bs);color:var(--b);padding:3px 8px;border-radius:20px;margin-right:7px}.card h2{margin:0 45px 17px 0;font-size:20px}.more{position:absolute;right:14px;top:13px;border:0;background:transparent;color:var(--s);font-size:22px}.menu{display:none;position:absolute;right:14px;top:48px;z-index:2;width:132px;padding:5px;background:var(--c);border:1px solid var(--l);border-radius:7px;box-shadow:0 4px 13px #0003}.menu.show{display:block}.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--i);padding:8px;border-radius:4px}.menu button:hover{background:var(--bs)}.menu .del{color:var(--r)}.move{display:flex;gap:5px;margin-top:10px}.move button{border:1px solid var(--l);background:var(--c);color:var(--b);border-radius:4px;padding:5px 9px}.krs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kr{padding:12px;background:var(--bs);border-radius:6px}.kr label{display:flex;gap:7px;align-items:flex-start}.kr input{accent-color:var(--b);margin-top:3px}.kr b{display:block;font-size:10px;color:var(--b);margin-bottom:5px}.mot{margin-top:14px;padding-top:13px;border-top:1px solid var(--l);color:var(--s)}.back{position:fixed;inset:0;z-index:5;display:none;place-items:center;padding:20px;background:#0008}.back.open{display:grid}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:var(--c);border-radius:12px;padding:23px}.modal h2{margin-top:0}.field{margin:15px 0}.field label{display:block;margin-bottom:6px;font-weight:700}input,textarea{width:100%;padding:10px;background:var(--c);border:1px solid var(--l);border-radius:5px;color:var(--i)}textarea{min-height:70px}.period{display:grid;grid-template-columns:1fr 1fr;gap:9px}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.picker{max-height:330px;overflow:auto}.pick{display:block;padding:12px;border-bottom:1px solid var(--l)}.notice{text-align:center;color:var(--s);font-size:12px;margin-top:22px}@media(max-width:650px){.wrap{width:min(100% - 26px,1100px)}.hero{display:block}.hero .btn{width:100%;margin-top:20px}.krs{grid-template-columns:1fr}.hero h1{font-size:29px}.tools .tool{padding:8px}.card{padding:18px}}@media print{header,.hero,.filters,.notice,.more,.menu,.back{display:none!important}main{padding:0}.card{display:none;border:0}.card.printing{display:block}.krs{grid-template-columns:repeat(3,1fr)}}
</style></head><body><header><div class="wrap nav"><div class="brand"><b>✓</b>OKR Planner</div><div class="tools"><button class="tool" id="wall">▣ 배경화면 저장</button><button class="tool" id="theme">☾</button></div></div></header><main class="wrap"><section class="hero"><div><h1>목표를 명확하게, 실행은 가볍게.</h1><p>나의 OKR을 살펴보고 다음 행동을 이어가세요.</p></div><button class="btn" id="new">＋ 새 OKR 만들기</button></section><div class="filters"><button class="tool filter on" data-filter="all">전체 보기</button><button class="tool filter" data-filter="active">미완료 보기</button></div><section class="list" id="list"></section><p class="notice">모든 데이터는 현재 사용 중인 기기에만 저장됩니다.</p></main>
<div class="back" id="editor"><form class="modal" id="form"><h2 id="formtitle">새 OKR 만들기</h2><input type="hidden" name="id"><div class="field"><label>목표 기간</label><div class="period"><input name="startDate" type="date" required><input name="endDate" type="date" required></div></div><div class="field"><label>O · 어떤 목표를 만들고 싶나요?</label><textarea name="objective" required></textarea></div><div class="field"><label>KR · 세부 목표 3가지</label><input name="kr1" required><br><br><input name="kr2" required><br><br><input name="kr3" required></div><div class="field"><label>이 목표를 세운 동기</label><textarea name="motivation" required></textarea></div><div class="foot"><button type="button" class="tool" data-close>취소</button><button class="btn">저장하기</button></div></form></div>
<div class="back" id="wallmodal"><section class="modal"><h2>OKR 배경화면 저장</h2><p>바탕화면에 넣을 OKR을 1개 이상, 최대 5개까지 선택하세요.</p><div class="picker" id="picks"></div><div class="foot"><button class="tool" data-close>취소</button><button class="btn" id="download">PNG 저장하기</button></div></section></div>
<script>
const $=s=>document.querySelector(s),key='okr-planner-goals';let filter='all';const get=()=>JSON.parse(localStorage.getItem(key)||'[]'),put=x=>localStorage.setItem(key,JSON.stringify(x)),esc=x=>String(x).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),complete=g=>(g.done||[]).every(Boolean)&&(g.done||[]).length===3;
function render(){let gs=get().filter(g=>filter==='all'||!complete(g)),el=$('#list');if(!gs.length){el.innerHTML='<div class="empty"><h2>당신의 첫 번째 목표를 기다리고 있어요 ✦</h2><p>작고 선명한 목표 하나가 큰 변화를 만듭니다.</p><button class="btn" data-new>첫 OKR 만들기</button></div>';return}el.innerHTML=gs.map(g=>`<article class="card ${complete(g)?'done':''}" data-id="${g.id}"><button class="more" data-more="${g.id}">⋮</button><div class="menu" id="menu-${g.id}"><button data-edit="${g.id}">✎ 편집</button><button data-copy="${g.id}">⧉ 복제</button><button data-print="${g.id}">🖨 인쇄</button><button class="del" data-delete="${g.id}">삭제</button></div><div class="meta"><span class="badge">${complete(g)?'완료':'OKR'}</span>${g.startDate} – ${g.endDate}</div><h2>${esc(g.objective)}</h2><div class="krs">${g.krs.map((v,i)=>`<div class="kr"><label><input type="checkbox" data-check="${g.id}-${i}" ${g.done?.[i]?'checked':''}><span><b>KEY RESULT ${i+1}</b>${esc(v)}</span></label></div>`).join('')}</div><div class="mot"><b>목표를 세운 동기</b> · ${esc(g.motivation)}</div><div class="move"><button data-up="${g.id}">↑ 위로</button><button data-down="${g.id}">↓ 아래로</button></div></article>`).join('')}
function open(g,copy){let f=$('#form');f.reset();f.elements.id.value=copy?'':g?.id||'';if(g){f.startDate.value=g.startDate;f.endDate.value=g.endDate;f.objective.value=g.objective;[f.kr1.value,f.kr2.value,f.kr3.value]=g.krs;f.motivation.value=g.motivation}$('#formtitle').textContent=g&&!copy?'OKR 편집하기':'새 OKR 만들기';$('#editor').classList.add('open')}
$('#new').onclick=()=>open();document.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>x.closest('.back').classList.remove('open'));$('#theme').onclick=()=>{let d=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=d;localStorage.setItem('okr-theme',d)};document.documentElement.dataset.theme=localStorage.getItem('okr-theme')||'light';
$('.filters').onclick=e=>{let b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('on',x===b));render()};
$('#form').onsubmit=e=>{e.preventDefault();let f=e.currentTarget;if(f.endDate.value<f.startDate.value)return alert('종료일은 시작일 이후로 선택해 주세요.');let a=get(),g={id:f.elements.id.value||Date.now(),startDate:f.startDate.value,endDate:f.endDate.value,objective:f.objective.value,krs:[f.kr1.value,f.kr2.value,f.kr3.value],motivation:f.motivation.value,done:[]},i=a.findIndex(x=>String(x.id)===String(g.id));if(i>=0)g.done=a[i].done||[],a[i]=g;else a.unshift(g);put(a);$('#editor').classList.remove('open');render()};
$('#list').onclick=e=>{let b=e.target.closest('button'),id=b&&(b.dataset.more||b.dataset.edit||b.dataset.copy||b.dataset.print||b.dataset.delete||b.dataset.up||b.dataset.down),a=get(),i=a.findIndex(x=>String(x.id)===String(id)),g=a[i];if(e.target.matches('[data-check]')){let [gid,n]=e.target.dataset.check.split('-');a.find(x=>String(x.id)===gid).done??=[];a.find(x=>String(x.id)===gid).done[+n]=e.target.checked;put(a);render();return}if(!b)return;if(b.dataset.more){document.querySelectorAll('.menu').forEach(x=>x.classList.remove('show'));$('#menu-'+id).classList.toggle('show');return}if(b.dataset.edit)open(g);if(b.dataset.copy)open(g,true);if(b.dataset.print){let c=$('[data-id="'+id+'"]');c.classList.add('printing');print();c.classList.remove('printing')}if(b.dataset.delete&&confirm('이 OKR을 삭제할까요?')){a.splice(i,1);put(a);render()}if(b.dataset.up&&i>0){[a[i-1],a[i]]=[a[i],a[i-1]];put(a);render()}if(b.dataset.down&&i<a.length-1){[a[i+1],a[i]]=[a[i],a[i+1]];put(a);render()}if('new' in b.dataset)open()};
$('#wall').onclick=()=>{let a=get();if(!a.length)return alert('저장된 OKR이 먼저 필요해요.');$('#picks').innerHTML=a.map(g=>`<label class="pick"><input type="checkbox" value="${g.id}"> ${esc(g.objective)}</label>`).join('');$('#wallmodal').classList.add('open')};$('#download').onclick=()=>{let sel=[...document.querySelectorAll('#picks input:checked')];if(sel.length<1||sel.length>5)return alert('OKR을 1개 이상 5개 이하로 선택해 주세요.');let a=get().filter(g=>sel.some(x=>String(x.value)===String(g.id))),c=document.createElement('canvas'),x=c.getContext('2d');c.width=1920;c.height=1080;x.fillStyle='#f8fafd';x.fillRect(0,0,c.width,c.height);x.fillStyle='#1a73e8';x.font='700 46px sans-serif';x.fillText('MY OKR',130,130);a.forEach((g,i)=>{let y=220+i*165;x.fillStyle='#fff';x.fillRect(120,y,1680,125);x.fillStyle='#1a73e8';x.font='600 25px sans-serif';x.fillText('OBJECTIVE',160,y+42);x.fillStyle='#202124';x.font='500 35px sans-serif';x.fillText(g.objective.slice(0,62),160,y+91)});let link=document.createElement('a');link.download='my-okr-wallpaper.png';link.href=c.toDataURL('image/png');link.click();$('#wallmodal').classList.remove('open')};render();
</script></body></html>

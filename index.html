<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OKR Planner</title>
  <style>
    :root {
      --b: #1a73e8;
      --i: #202124;
      --s: #5f6368;
      --l: #dadce0;
      --bg: #f8fafd;
      --c: #fff;
      --soft: #eef4ff;
    }

    html[data-theme="dark"] {
      --i: #e8eaed;
      --s: #bdc1c6;
      --l: #5f6368;
      --bg: #202124;
      --c: #292a2d;
      --soft: #283b5c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--i);
      font: 14px Arial, "Noto Sans KR", sans-serif;
    }

    .wrap {
      width: min(1280px, calc(100% - 32px));
      margin: auto;
    }

    header {
      background: var(--c);
      border-bottom: 1px solid var(--l);
    }

    .nav {
      height: 68px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 20px;
      font-weight: bold;
    }

    .brand b {
      background: var(--b);
      color: #fff;
      padding: 6px 9px;
      border-radius: 6px;
      margin-right: 8px;
    }

    .tool,
    .btn {
      padding: 9px 12px;
      border: 1px solid var(--l);
      border-radius: 5px;
      background: var(--c);
      color: var(--i);
      cursor: pointer;
    }

    .btn {
      background: var(--b);
      color: #fff;
      border-color: var(--b);
    }

    .tools,
    .filters {
      display: flex;
      gap: 7px;
    }

    main {
      padding: 42px 0;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: end;
      margin-bottom: 26px;
    }

    .hero h1 {
      font-size: 34px;
      margin: 0 0 8px;
    }

    .hero p,
    .notice {
      color: var(--s);
    }

    .filters {
      margin-bottom: 15px;
    }

    .filter.on {
      background: var(--soft);
      color: var(--b);
      border-color: var(--b);
    }

    .list {
      display: grid;
      gap: 13px;
    }

    .card,
    .empty {
      background: var(--c);
      border: 1px solid var(--l);
      border-radius: 10px;
    }

    .card {
      position: relative;
      padding: 22px;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s, border-color 0.15s;
    }

    .card.done {
      opacity: 0.65;
    }

    .card.done h2 {
      text-decoration: line-through;
    }

    .card.dragging {
      opacity: 0.35;
      border: 2px dashed var(--b);
    }

    .card.drag-over {
      border-top: 3px solid var(--b);
      box-shadow: 0 -4px 8px rgba(26, 115, 232, 0.15);
    }

    .empty {
      text-align: center;
      padding: 65px;
    }

    .meta {
      font-size: 12px;
      color: var(--s);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .drag-handle {
      cursor: grab;
      font-size: 16px;
      color: var(--s);
      user-select: none;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 3px;
      transition: color 0.15s, background 0.15s;
    }

    .drag-handle:hover {
      color: var(--b);
      background: var(--soft);
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .badge {
      color: var(--b);
      background: var(--soft);
      padding: 3px 7px;
      border-radius: 12px;
    }

    .card h2 {
      margin: 12px 45px 16px 0;
    }

    .more {
      position: absolute;
      right: 12px;
      top: 10px;
      border: 0;
      background: transparent;
      color: var(--s);
      font-size: 23px;
      cursor: pointer;
    }

    .menu {
      display: none;
      position: absolute;
      right: 13px;
      top: 44px;
      z-index: 2;
      background: var(--c);
      border: 1px solid var(--l);
      border-radius: 6px;
      padding: 4px;
    }

    .menu.show {
      display: block;
    }

    .menu button {
      display: block;
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--i);
      padding: 8px;
      text-align: left;
      cursor: pointer;
    }

    .krs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .kr {
      background: var(--soft);
      border: 1px solid var(--l);
      border-radius: 6px;
      padding: 12px;
      color: var(--i);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.15s, transform 0.1s;
    }

    .kr:hover {
      border-color: var(--b);
      box-shadow: 0 2px 6px rgba(26, 115, 232, 0.15);
    }

    .kr:active {
      transform: scale(0.99);
    }

    .kr.done {
      background: #e8f0fe;
      border-color: var(--b);
    }

    html[data-theme="dark"] .kr.done {
      background: #23334d;
      border-color: var(--b);
    }

    .kr-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .kr b {
      color: var(--b);
      font-size: 11px;
    }

    .kr-status {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--c);
      color: var(--s);
      border: 1px solid var(--l);
      font-weight: 500;
      transition: all 0.15s;
    }

    .kr.done .kr-status {
      background: var(--b);
      color: #fff;
      border-color: var(--b);
      font-weight: bold;
    }

    .kr-text {
      margin: 0;
      font-size: 13px;
      line-height: 1.4;
      word-break: break-word;
    }

    .kr.done .kr-text {
      color: var(--s);
      text-decoration: line-through;
    }

    .mot {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--l);
      color: var(--s);
    }

    .back {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 5;
      background: #0008;
      padding: 20px;
      place-items: center;
    }

    .back.open {
      display: grid;
    }

    .modal {
      width: min(650px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: var(--c);
      padding: 23px;
      border-radius: 10px;
    }

    .field {
      margin: 14px 0;
    }

    .field label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--l);
      background: var(--c);
      color: var(--i);
      border-radius: 4px;
    }

    textarea {
      min-height: 70px;
    }

    .period,
    .krsform {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .presets {
      display: flex;
      gap: 6px;
      margin-top: 7px;
      flex-wrap: wrap;
    }

    .preset {
      padding: 4px 9px;
      font-size: 12px;
      border: 1px solid var(--l);
      border-radius: 4px;
      background: var(--soft);
      color: var(--b);
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s;
    }

    .preset:hover {
      background: var(--b);
      color: #fff;
    }

    .foot {
      display: flex;
      justify-content: flex-end;
      gap: 7px;
      margin-top: 20px;
    }

    .pick {
      display: block;
      padding: 10px;
      border-bottom: 1px solid var(--l);
    }

    @media (max-width: 650px) {
      .nav {
        height: auto;
        padding: 12px 0;
        flex-wrap: wrap;
        gap: 10px;
      }
      .tools {
        flex-wrap: wrap;
      }
      .hero {
        display: block;
      }
      .hero .btn {
        width: 100%;
        margin-top: 18px;
      }
      .krs {
        grid-template-columns: 1fr;
      }
      .empty {
        padding: 40px 15px;
      }
      .card {
        padding: 17px;
      }
    }

    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #202124;
      color: #fff;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 500;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1), transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      max-width: calc(100% - 40px);
      text-align: center;
    }

    html[data-theme="dark"] .toast {
      background: #e8eaed;
      color: #202124;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 달력 및 메인 레이아웃 스타일 */
    .main-layout {
      display: grid;
      grid-template-columns: 1fr 370px;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 960px) {
      .main-layout {
        grid-template-columns: 1fr;
      }
      .calendar-aside {
        position: static !important;
        margin-top: 16px;
      }
    }

    .calendar-aside {
      position: sticky;
      top: 20px;
    }

    .cal-card {
      background: var(--c);
      border: 1px solid var(--l);
      border-radius: 10px;
      padding: 18px;
    }

    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .cal-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cal-title {
      margin: 0;
      font-size: 16px;
      font-weight: bold;
    }

    .cal-today-btn {
      padding: 3px 8px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 4px;
    }

    .cal-nav {
      display: flex;
      gap: 4px;
    }

    .cal-btn {
      padding: 4px 8px;
      font-size: 12px;
      line-height: 1;
      border-radius: 4px;
    }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 11px;
      font-weight: bold;
      color: var(--s);
      margin-bottom: 8px;
    }

    .cal-weekday:first-child {
      color: #ea4335;
    }

    .cal-weekday:last-child {
      color: var(--b);
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cal-day {
      aspect-ratio: 1;
      border-radius: 6px;
      border: 1px solid transparent;
      padding: 4px 2px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      cursor: pointer;
      user-select: none;
      font-size: 12px;
      position: relative;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }

    .cal-day:hover {
      background: var(--soft);
    }

    .cal-day.other-month {
      opacity: 0.35;
    }

    .cal-day.today .cal-day-num {
      background: var(--b);
      color: #fff;
      border-radius: 50%;
      font-weight: bold;
    }

    .cal-day.selected {
      border-color: var(--b);
      background: var(--soft);
      font-weight: bold;
    }

    .cal-day.in-hover-range {
      background: var(--soft);
      border-color: var(--b);
    }

    .cal-day-num {
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
    }

    .cal-day-dots {
      display: flex;
      gap: 2px;
      margin-top: 3px;
      min-height: 5px;
      align-items: center;
      justify-content: center;
    }

    .cal-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
    }

    .cal-dot.active {
      background: var(--b);
    }

    .cal-dot.done {
      background: #34a853;
    }

    .cal-selected-info {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--l);
    }

    .cal-selected-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 13px;
    }

    .cal-selected-date-text {
      font-weight: bold;
      color: var(--i);
    }

    .cal-selected-count {
      font-size: 11px;
      color: var(--s);
      background: var(--soft);
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 500;
    }

    .cal-events-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 260px;
      overflow-y: auto;
    }

    .cal-event-item {
      padding: 9px 11px;
      border: 1px solid var(--l);
      border-radius: 6px;
      background: var(--bg);
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s, box-shadow 0.15s;
    }

    .cal-event-item:hover {
      border-color: var(--b);
      box-shadow: 0 2px 6px rgba(26, 115, 232, 0.12);
      transform: translateY(-1px);
    }

    .cal-event-item.done {
      opacity: 0.7;
    }

    .cal-event-title {
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 4px;
      line-height: 1.3;
      word-break: break-word;
    }

    .cal-event-meta {
      font-size: 11px;
      color: var(--s);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cal-event-badge {
      padding: 2px 5px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: bold;
    }

    .cal-event-badge.active {
      background: var(--soft);
      color: var(--b);
    }

    .cal-event-badge.done {
      background: #e6f4ea;
      color: #137333;
    }

    html[data-theme="dark"] .cal-event-badge.done {
      background: #1e3a29;
      color: #81c995;
    }

    .cal-event-empty {
      text-align: center;
      color: var(--s);
      font-size: 12px;
      padding: 16px 8px;
    }

    .cal-add-btn {
      width: 100%;
      margin-top: 8px;
      padding: 7px;
      font-size: 12px;
      border: 1px dashed var(--l);
      background: transparent;
      color: var(--b);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.15s, border-color 0.15s;
    }

    .cal-add-btn:hover {
      background: var(--soft);
      border-color: var(--b);
    }

    @keyframes cardPulse {
      0% { box-shadow: 0 0 0 0 rgba(26, 115, 232, 0.7); transform: scale(1); }
      40% { box-shadow: 0 0 0 8px rgba(26, 115, 232, 0.2); transform: scale(1.01); }
      100% { box-shadow: 0 0 0 0 rgba(26, 115, 232, 0); transform: scale(1); }
    }

    .card.highlighted {
      animation: cardPulse 1.2s ease-out;
      border-color: var(--b) !important;
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap nav">
      <div class="brand"><b>✓</b>OKR Planner</div>
      <div class="tools">
        <button class="tool" id="exp">⤓ <span id="expt">내보내기</span></button>
        <button class="tool" id="imp">⤒ <span id="impt">가져오기</span></button>
        <input type="file" id="file" accept=".json" style="display:none">
        <button class="tool" id="wall">▣ Wallpaper</button>
        <button class="tool" id="lang">EN / 한</button>
        <button class="tool" id="theme">☾</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="hero">
      <div>
        <h1 id="title">목표를 명확하게, 실행은 가볍게.</h1>
        <p id="desc">나의 OKR을 살펴보고 다음 행동을 이어가세요.</p>
      </div>
      <button class="btn" id="new">＋ <span id="newt">새 OKR 만들기</span></button>
    </div>

    <div class="main-layout">
      <div class="main-content">
        <div class="filters">
          <button class="tool filter on" data-f="all" id="all">전체 보기</button>
          <button class="tool filter" data-f="active" id="active">미완료 보기</button>
        </div>

        <section class="list" id="list"></section>
      </div>

      <aside class="calendar-aside">
        <div class="cal-card">
          <div class="cal-header">
            <div class="cal-title-wrap">
              <h3 class="cal-title" id="cal-month-label"></h3>
              <button class="tool cal-today-btn" id="cal-today" type="button">오늘</button>
            </div>
            <div class="cal-nav">
              <button class="tool cal-btn" id="cal-prev" type="button" aria-label="이전 달">&lt;</button>
              <button class="tool cal-btn" id="cal-next" type="button" aria-label="다음 달">&gt;</button>
            </div>
          </div>
          <div class="cal-weekdays" id="cal-weekdays"></div>
          <div class="cal-grid" id="cal-grid"></div>

          <div class="cal-selected-info">
            <div class="cal-selected-header">
              <span class="cal-selected-date-text" id="cal-selected-date-text"></span>
              <span class="cal-selected-count" id="cal-selected-count"></span>
            </div>
            <div class="cal-events-list" id="cal-events-list"></div>
            <button class="cal-add-btn" id="cal-add-date-btn" type="button">＋ 이 날짜로 새 OKR 만들기</button>
          </div>
        </div>
      </aside>
    </div>

    <p class="notice" id="notice">모든 데이터는 현재 사용 중인 기기에 저장되며, JSON 파일로 다른 기기에 옮길 수 있습니다.</p>
  </main>

  <!-- OKR 생성 / 수정 모달 -->
  <div class="back" id="edit">
    <form class="modal" id="form">
      <h2 id="ft">새 OKR 만들기</h2>
      <input name="id" type="hidden">

      <div class="field">
        <label id="period">목표 기간</label>
        <div class="period">
          <input name="startDate" type="date" required>
          <input name="endDate" type="date" required>
        </div>
        <div class="presets">
          <button type="button" class="preset" data-p="1d">1일</button>
          <button type="button" class="preset" data-p="1w">일주일</button>
          <button type="button" class="preset" data-p="1m">1개월</button>
          <button type="button" class="preset" data-p="3m">3개월</button>
          <button type="button" class="preset" data-p="1y">1년</button>
        </div>
      </div>

      <div class="field">
        <label id="obj">O · 어떤 목표를 만들고 싶나요?</label>
        <textarea name="objective" required></textarea>
      </div>

      <div class="field">
        <label id="krlabel">KR · 세부 목표 3가지</label>
        <input name="kr1" required><br><br>
        <input name="kr2" required><br><br>
        <input name="kr3" required>
      </div>

      <div class="field">
        <label id="motlabel">이 목표를 세운 동기</label>
        <textarea name="motivation" required></textarea>
      </div>

      <div class="foot">
        <button class="tool" type="button" data-close>취소</button>
        <button class="btn">저장</button>
      </div>
    </form>
  </div>

  <!-- 배경화면 내보내기 모달 -->
  <div class="back" id="picker">
    <div class="modal">
      <h2 id="wt">배경화면 저장</h2>
      <p id="wp">OKR을 1~5개 선택하세요.</p>
      <div id="picks"></div>
      <div class="foot">
        <button class="tool" data-close>취소</button>
        <button class="btn" id="down">PNG 저장</button>
      </div>
    </div>
  </div>

  <!-- JSON 가져오기 옵션 모달 -->
  <div class="back" id="imp-modal">
    <div class="modal" style="max-width:440px">
      <h2 id="imptit">데이터 가져오기</h2>
      <p id="impdesc" style="color:var(--s);margin:10px 0 20px">불러온 데이터를 기존 목록에 어떻게 반영할까요?</p>
      <div class="foot" style="justify-content:space-between">
        <button class="tool" data-close type="button">취소</button>
        <div style="display:flex;gap:8px">
          <button class="tool" id="imp-append" type="button">＋ 추가하기</button>
          <button class="btn" id="imp-replace" type="button">덮어씌우기</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 응원 메시지 토스트 -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const $ = s => document.querySelector(s);
    const key = 'okr-planner-goals';
    let lang = localStorage.okrLang || 'ko';
    let filter = 'all';

    const tx = {
      ko: [
        '목표를 명확하게, 실행은 가볍게.',
        '나의 OKR을 살펴보고 다음 행동을 이어가세요.',
        '새 OKR 만들기',
        '전체 보기',
        '미완료 보기',
        '모든 데이터는 현재 사용 중인 기기에 저장되며, JSON 파일로 다른 기기에 옮길 수 있습니다.',
        '목표 기간',
        'O · 어떤 목표를 만들고 싶나요?',
        'KR · 세부 목표 3가지',
        '이 목표를 세운 동기',
        '저장',
        '취소',
        '배경화면 저장',
        'OKR을 1~5개 선택하세요.',
        '내보내기',
        '가져오기',
        '데이터 가져오기',
        '불러온 데이터를 기존 목록에 어떻게 반영할까요?',
        '덮어씌우기',
        '＋ 추가하기'
      ],
      en: [
        'Make goals clear. Keep action simple.',
        'Review your OKRs and take your next action.',
        'Create OKR',
        'All',
        'Active',
        'All data is stored on this device and can be transferred via JSON file.',
        'Goal period',
        'O · What do you want to achieve?',
        'KR · Three key results',
        'Why this goal?',
        'Save',
        'Cancel',
        'Save wallpaper',
        'Select 1–5 OKRs.',
        'Export',
        'Import',
        'Import Data',
        'How would you like to apply the imported data?',
        'Overwrite',
        '＋ Append'
      ]
    };

    const presetTx = {
      ko: ['1일', '일주일', '1개월', '3개월', '1년'],
      en: ['1 Day', '1 Week', '1 Month', '3 Months', '1 Year']
    };

    const T = i => tx[lang][i];
    const get = () => JSON.parse(localStorage.getItem(key) || '[]');
    const put = x => localStorage.setItem(key, JSON.stringify(x));
    const done = g => Boolean(g.done?.[0] && g.done?.[1] && g.done?.[2]);
    const esc = x => String(x).replace(/[&<>'"]/g, c => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      "'": '&#39;',
      '"': '&quot;'
    }[c]));

    // 달력 상태 및 날짜 헬퍼
    let calDate = new Date();
    let selectedDate = new Date().toLocaleDateString('sv');
    let hoveredOkrId = null;

    const isGoalOnDate = (g, dateStr) => {
      if (!g.startDate || !g.endDate) return false;
      let s = g.startDate <= g.endDate ? g.startDate : g.endDate;
      let e = g.startDate <= g.endDate ? g.endDate : g.startDate;
      return s <= dateStr && dateStr <= e;
    };

    function renderCalendar() {
      let year = calDate.getFullYear();
      let month = calDate.getMonth();
      let allGoals = get();

      let monthNames = lang === 'ko'
        ? ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월']
        : ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

      $('#cal-month-label').textContent = lang === 'ko' ? `${year}년 ${monthNames[month]}` : `${monthNames[month]} ${year}`;
      $('#cal-today').textContent = lang === 'ko' ? '오늘' : 'Today';
      $('#cal-add-date-btn').textContent = lang === 'ko' ? '＋ 이 날짜로 목표 만들기' : '＋ Create goal for this date';

      let weekdays = lang === 'ko' ? ['일', '월', '화', '수', '목', '금', '토'] : ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      $('#cal-weekdays').innerHTML = weekdays.map(w => `<div class="cal-weekday">${w}</div>`).join('');

      let firstDayIndex = new Date(year, month, 1).getDay();
      let lastDate = new Date(year, month + 1, 0).getDate();
      let prevLastDate = new Date(year, month, 0).getDate();
      let todayStr = new Date().toLocaleDateString('sv');

      let hoveredGoal = hoveredOkrId ? allGoals.find(x => String(x.id) === String(hoveredOkrId)) : null;
      let html = '';

      const toDateStr = (y, m, d) => `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

      // 이전 달 날짜 채우기
      for (let x = firstDayIndex; x > 0; x--) {
        let d = prevLastDate - x + 1;
        let prevM = month === 0 ? 11 : month - 1;
        let prevY = month === 0 ? year - 1 : year;
        let dateStr = toDateStr(prevY, prevM, d);
        html += renderDayCell(dateStr, d, true, todayStr, allGoals, hoveredGoal);
      }

      // 이번 달 날짜 채우기
      for (let d = 1; d <= lastDate; d++) {
        let dateStr = toDateStr(year, month, d);
        html += renderDayCell(dateStr, d, false, todayStr, allGoals, hoveredGoal);
      }

      // 다음 달 날짜 채우기 (35 또는 42 그리드 유지)
      let totalCells = firstDayIndex + lastDate;
      let targetTotal = totalCells <= 35 ? 35 : 42;
      let nextCount = targetTotal - totalCells;
      for (let d = 1; d <= nextCount; d++) {
        let nextM = month === 11 ? 0 : month + 1;
        let nextY = month === 11 ? year + 1 : year;
        let dateStr = toDateStr(nextY, nextM, d);
        html += renderDayCell(dateStr, d, true, todayStr, allGoals, hoveredGoal);
      }

      $('#cal-grid').innerHTML = html;
      renderSelectedDateEvents();
    }

    function renderDayCell(dateStr, dayNum, isOtherMonth, todayStr, allGoals, hoveredGoal) {
      let isToday = dateStr === todayStr;
      let isSelected = dateStr === selectedDate;

      let goalsOnDay = allGoals.filter(g => isGoalOnDate(g, dateStr));
      let hasEvents = goalsOnDay.length > 0;

      let inHoverRange = false;
      if (hoveredGoal && isGoalOnDate(hoveredGoal, dateStr)) {
        inHoverRange = true;
      }

      let dotsHtml = '';
      if (hasEvents) {
        let activeCount = goalsOnDay.filter(g => !done(g)).length;
        let doneCount = goalsOnDay.filter(g => done(g)).length;

        let dots = [];
        if (activeCount > 0) dots.push('<span class="cal-dot active"></span>');
        if (doneCount > 0) dots.push('<span class="cal-dot done"></span>');
        if (goalsOnDay.length > 2 && dots.length < 3) dots.push('<span class="cal-dot active"></span>');

        dotsHtml = `<div class="cal-day-dots">${dots.join('')}</div>`;
      }

      let classes = ['cal-day'];
      if (isOtherMonth) classes.push('other-month');
      if (isToday) classes.push('today');
      if (isSelected) classes.push('selected');
      if (hasEvents) classes.push('has-events');
      if (inHoverRange) classes.push('in-hover-range');

      return `
        <div class="${classes.join(' ')}" data-date="${dateStr}" title="${goalsOnDay.length ? goalsOnDay.length + (lang === 'ko' ? '개의 목표' : ' OKRs') : ''}">
          <span class="cal-day-num">${dayNum}</span>
          ${dotsHtml}
        </div>
      `;
    }

    function renderSelectedDateEvents() {
      let allGoals = get();
      let goalsOnDay = allGoals.filter(g => isGoalOnDate(g, selectedDate));

      let [y, m, d] = selectedDate.split('-').map(Number);
      let todayStr = new Date().toLocaleDateString('sv');
      let isToday = selectedDate === todayStr;

      let dateTitle = '';
      if (lang === 'ko') {
        dateTitle = `${m}월 ${d}일` + (isToday ? ' (오늘)' : '');
      } else {
        let mNamesShort = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        dateTitle = `${mNamesShort[m - 1]} ${d}` + (isToday ? ' (Today)' : '');
      }

      $('#cal-selected-date-text').textContent = dateTitle;
      $('#cal-selected-count').textContent = lang === 'ko'
        ? `${goalsOnDay.length}개의 목표`
        : `${goalsOnDay.length} ${goalsOnDay.length === 1 ? 'goal' : 'goals'}`;

      let listEl = $('#cal-events-list');
      if (!goalsOnDay.length) {
        listEl.innerHTML = `<div class="cal-event-empty">${lang === 'ko' ? '이 날짜에 진행 중인 목표가 없습니다.' : 'No goals scheduled for this date.'}</div>`;
        return;
      }

      listEl.innerHTML = goalsOnDay.map(g => {
        let isDone = done(g);
        let completedKrCount = [0, 1, 2].filter(i => Boolean(g.done?.[i])).length;
        let badgeText = isDone
          ? (lang === 'ko' ? '✓ 완료' : '✓ Done')
          : (lang === 'ko' ? `KR ${completedKrCount}/3 완료` : `KR ${completedKrCount}/3 Done`);

        return `
          <div class="cal-event-item ${isDone ? 'done' : ''}" data-goto-id="${g.id}" title="${lang === 'ko' ? '클릭하여 해당 OKR 카드로 이동' : 'Click to jump to this OKR card'}">
            <div class="cal-event-title">${esc(g.objective)}</div>
            <div class="cal-event-meta">
              <span>${g.startDate} ~ ${g.endDate}</span>
              <span class="cal-event-badge ${isDone ? 'done' : 'active'}">${badgeText}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function updateCalendarHover() {
      let allGoals = get();
      let hoveredGoal = hoveredOkrId ? allGoals.find(x => String(x.id) === String(hoveredOkrId)) : null;
      document.querySelectorAll('.cal-day').forEach(cell => {
        let dateStr = cell.dataset.date;
        if (hoveredGoal && isGoalOnDate(hoveredGoal, dateStr)) {
          cell.classList.add('in-hover-range');
        } else {
          cell.classList.remove('in-hover-range');
        }
      });
    }

    function words() {
      ['title', 'desc', 'newt', 'all', 'active', 'notice', 'period', 'obj', 'krlabel', 'motlabel'].forEach((id, i) => {
        $('#' + id).textContent = T(i);
      });
      document.querySelectorAll('[data-close]').forEach(x => x.textContent = T(11));
      $('#wall').textContent = '▣ ' + T(12);
      $('#wt').textContent = T(12);
      $('#wp').textContent = T(13);
      $('#expt').textContent = T(14);
      $('#impt').textContent = T(15);
      $('#imptit').textContent = T(16);
      $('#impdesc').textContent = T(17);
      $('#imp-replace').textContent = T(18);
      $('#imp-append').textContent = T(19);
      document.querySelectorAll('.preset').forEach((b, i) => b.textContent = presetTx[lang][i]);
      render();
    }

    function render() {
      let a = get().filter(g => filter === 'all' || !done(g));
      let l = $('#list');

      if (!a.length) {
        l.innerHTML = `
          <div class="empty">
            <h2>✦ ${lang === 'ko' ? '첫 번째 목표를 만들어 보세요' : 'Create your first goal'}</h2>
            <button class="btn" data-new>${T(2)}</button>
          </div>`;
        renderCalendar();
        return;
      }

      l.innerHTML = a.map(g => `
        <article class="card ${done(g) ? 'done' : ''}" data-id="${g.id}">
          <button class="more" data-more="${g.id}">⋮</button>
          <div class="menu" id="m${g.id}">
            <button data-edit="${g.id}">Edit</button>
            <button data-copy="${g.id}">Duplicate</button>
            <button data-del="${g.id}">Delete</button>
          </div>
          <div class="meta">
            <span class="drag-handle" draggable="true" title="${lang === 'ko' ? '드래그하여 순서 변경' : 'Drag to reorder'}">⠿</span>
            <span class="badge">${done(g) ? 'DONE' : 'OKR'}</span> ${g.startDate} – ${g.endDate}
          </div>
          <h2>${esc(g.objective)}</h2>
          <div class="krs">
            ${g.krs.map((v, i) => `
              <div class="kr ${g.done?.[i] ? 'done' : ''}" data-kr="${g.id}:${i}" role="button" tabindex="0">
                <div class="kr-top">
                  <b>KEY RESULT ${i + 1}</b>
                  <span class="kr-status">${g.done?.[i] ? (lang === 'ko' ? '✓ 완료' : '✓ Done') : (lang === 'ko' ? '미완료' : 'To Do')}</span>
                </div>
                <p class="kr-text">${esc(v)}</p>
              </div>
            `).join('')}
          </div>
          <div class="mot">Why · ${esc(g.motivation)}</div>
        </article>
      `).join('');
      renderCalendar();
    }

    function open(g, copy, defaultDate) {
      let f = $('#form');
      f.reset();
      f.id.value = copy ? '' : g?.id || '';
      let today = defaultDate || new Date().toLocaleDateString('sv');
      f.startDate.value = g ? g.startDate : today;
      f.endDate.value = g ? g.endDate : today;
      if (g) {
        f.objective.value = g.objective;
        [f.kr1.value, f.kr2.value, f.kr3.value] = g.krs;
        f.motivation.value = g.motivation;
      }
      $('#ft').textContent = g && !copy ? 'Edit OKR' : T(2);
      $('#edit').classList.add('open');
    }

    // 새 OKR 버튼
    $('#new').onclick = () => open();

    // 언어 전환
    $('#lang').onclick = () => {
      lang = lang === 'ko' ? 'en' : 'ko';
      localStorage.okrLang = lang;
      words();
    };

    // 테마 토글
    $('#theme').onclick = () => {
      let d = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = d;
      localStorage.okrTheme = d;
    };
    document.documentElement.dataset.theme = localStorage.okrTheme || 'light';

    // 모달 닫기
    document.querySelectorAll('[data-close]').forEach(x => {
      x.onclick = () => x.closest('.back').classList.remove('open');
    });

    // 폼 저장
    $('#form').onsubmit = e => {
      e.preventDefault();
      let f = e.target;
      let a = get();
      let g = {
        id: f.id.value || Date.now(),
        startDate: f.startDate.value,
        endDate: f.endDate.value,
        objective: f.objective.value,
        krs: [f.kr1.value, f.kr2.value, f.kr3.value],
        motivation: f.motivation.value,
        done: []
      };
      let i = a.findIndex(x => String(x.id) === String(g.id));
      if (i < 0) {
        a.unshift(g);
      } else {
        g.done = a[i].done || [];
        a[i] = g;
      }
      put(a);
      $('#edit').classList.remove('open');
      render();
    };

    // 응원 메시지 토스트 표시
    let toastTimer = null;
    function showCheer(remaining) {
      let toast = $('#toast');
      if (!toast) return;

      let msg = '';
      if (lang === 'ko') {
        if (remaining === 0) {
          msg = '🎉 모든 세부 목표를 완료했어요! 정말 대단해요!';
        } else if (remaining === 1) {
          msg = '💪 1개 남았어요. 거의 다 왔어요! 대단해요!';
        } else {
          msg = `👏 ${remaining}개 남았어요. 대단해요!`;
        }
      } else {
        if (remaining === 0) {
          msg = '🎉 All Key Results completed! Amazing job!';
        } else if (remaining === 1) {
          msg = '💪 1 left. Almost there! Great job!';
        } else {
          msg = `👏 ${remaining} left. Great job!`;
        }
      }

      toast.textContent = msg;
      toast.classList.remove('show');
      void toast.offsetWidth;
      toast.classList.add('show');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    // 목표 목록 클릭 이벤트 (KR 완료 토글, 메뉴, 수정, 복제, 삭제)
    $('#list').onclick = e => {
      // 1. Key Result div 클릭 시 완료/미완료 토글
      let kr = e.target.closest('.kr');
      if (kr && kr.dataset.kr) {
        let [id, n] = kr.dataset.kr.split(':');
        let a = get();
        let g = a.find(x => String(x.id) === id);
        if (g) {
          g.done ??= [];
          let isNowDone = !g.done[n];
          g.done[n] = isNowDone;
          put(a);
          render();

          if (isNowDone) {
            let remaining = 3 - [0, 1, 2].filter(i => Boolean(g.done?.[i])).length;
            showCheer(remaining);
          }
        }
        return;
      }

      // 2. 버튼 클릭 이벤트 (더보기, 수정, 복제, 삭제, 새 OKR)
      let b = e.target.closest('button');
      if (!b) return;

      if ('new' in b.dataset) return open();

      let id = Object.values(b.dataset)[0];
      let a = get();
      let i = a.findIndex(x => String(x.id) === String(id));
      let g = a[i];

      if (b.dataset.more) return $('#m' + id).classList.toggle('show');
      if (b.dataset.edit) open(g);
      if (b.dataset.copy) open(g, true);
      if (b.dataset.del) {
        a.splice(i, 1);
        put(a);
        render();
      }
    };

    // 키보드 접근성 (Enter / Space로 KR 완료 토글)
    $('#list').onkeydown = e => {
      if (e.key === 'Enter' || e.key === ' ') {
        let kr = e.target.closest('.kr');
        if (kr) {
          e.preventDefault();
          kr.click();
        }
      }
    };

    // 드래그 & 드롭 순서 변경 (Drag and Drop)
    let draggedCard = null;

    $('#list').ondragstart = e => {
      let handle = e.target.closest('.drag-handle');
      if (!handle) {
        e.preventDefault();
        return;
      }
      let card = handle.closest('.card');
      if (!card) return;

      draggedCard = card;
      e.dataTransfer.setData('text/plain', card.dataset.id);
      e.dataTransfer.effectAllowed = 'move';
      if (e.dataTransfer.setDragImage) {
        e.dataTransfer.setDragImage(card, 20, 20);
      }
      setTimeout(() => card.classList.add('dragging'), 0);
    };

    $('#list').ondragover = e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      let card = e.target.closest('.card');
      if (card && card !== draggedCard) {
        document.querySelectorAll('.card.drag-over').forEach(c => {
          if (c !== card) c.classList.remove('drag-over');
        });
        card.classList.add('drag-over');
      }
    };

    $('#list').ondragleave = e => {
      let card = e.target.closest('.card');
      if (card && !card.contains(e.relatedTarget)) {
        card.classList.remove('drag-over');
      }
    };

    $('#list').ondrop = e => {
      e.preventDefault();
      let targetCard = e.target.closest('.card');
      document.querySelectorAll('.card.drag-over').forEach(c => c.classList.remove('drag-over'));
      if (!draggedCard || !targetCard || draggedCard === targetCard) return;

      let srcId = draggedCard.dataset.id;
      let tgtId = targetCard.dataset.id;
      let a = get();
      let srcIdx = a.findIndex(x => String(x.id) === String(srcId));
      let tgtIdx = a.findIndex(x => String(x.id) === String(tgtId));

      if (srcIdx > -1 && tgtIdx > -1) {
        let [item] = a.splice(srcIdx, 1);
        a.splice(tgtIdx, 0, item);
        put(a);
        render();
      }
    };

    $('#list').ondragend = () => {
      if (draggedCard) draggedCard.classList.remove('dragging');
      draggedCard = null;
      document.querySelectorAll('.card.drag-over').forEach(c => c.classList.remove('drag-over'));
    };

    // 필터링
    document.querySelector('.filters').onclick = e => {
      if (!e.target.dataset.f) return;
      filter = e.target.dataset.f;
      document.querySelectorAll('.filter').forEach(x => x.classList.toggle('on', x.dataset.f === filter));
      render();
    };

    // 달력 네비게이션 및 상호작용
    $('#cal-prev').onclick = () => {
      calDate.setMonth(calDate.getMonth() - 1);
      renderCalendar();
    };

    $('#cal-next').onclick = () => {
      calDate.setMonth(calDate.getMonth() + 1);
      renderCalendar();
    };

    $('#cal-today').onclick = () => {
      calDate = new Date();
      selectedDate = new Date().toLocaleDateString('sv');
      renderCalendar();
    };

    $('#cal-grid').onclick = e => {
      let cell = e.target.closest('.cal-day');
      if (!cell || !cell.dataset.date) return;
      selectedDate = cell.dataset.date;
      let [y, m] = selectedDate.split('-').map(Number);
      if (calDate.getFullYear() !== y || calDate.getMonth() !== m - 1) {
        calDate = new Date(y, m - 1, 1);
      }
      renderCalendar();
    };

    $('#cal-add-date-btn').onclick = () => {
      open(null, false, selectedDate);
    };

    $('#cal-events-list').onclick = e => {
      let item = e.target.closest('[data-goto-id]');
      if (!item) return;
      let id = item.dataset.gotoId;
      let card = document.querySelector(`.card[data-id="${id}"]`);
      if (!card) {
        filter = 'all';
        document.querySelectorAll('.filter').forEach(x => x.classList.toggle('on', x.dataset.f === 'all'));
        render();
        card = document.querySelector(`.card[data-id="${id}"]`);
      }
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        card.classList.remove('highlighted');
        void card.offsetWidth;
        card.classList.add('highlighted');
        setTimeout(() => card.classList.remove('highlighted'), 1500);
      }
    };

    // OKR 카드 호버 시 달력 날짜 하이라이트
    $('#list').addEventListener('mouseover', e => {
      let card = e.target.closest('.card');
      let newId = card ? card.dataset.id : null;
      if (newId !== hoveredOkrId) {
        hoveredOkrId = newId;
        updateCalendarHover();
      }
    });

    $('#list').addEventListener('mouseleave', () => {
      if (hoveredOkrId) {
        hoveredOkrId = null;
        updateCalendarHover();
      }
    });

    // 배경화면 모달 열기
    $('#wall').onclick = () => {
      let a = get();
      if (!a.length) return;
      $('#picks').innerHTML = a.map(g => `<label class="pick"><input type="checkbox" value="${g.id}"> ${esc(g.objective)}</label>`).join('');
      $('#picker').classList.add('open');
    };

    // 배경화면 PNG 다운로드
    $('#down').onclick = async () => {
      let ids = [...document.querySelectorAll('#picks input:checked')].map(x => x.value);
      if (!ids.length || ids.length > 5) return alert(lang === 'ko' ? '1~5개를 선택해 주세요.' : 'Please select 1 to 5 OKRs.');

      let a = get().filter(g => ids.includes(String(g.id)));
      let c = document.createElement('canvas');
      let x = c.getContext('2d');
      c.width = 1920;
      c.height = 1080;

      // 배경
      x.fillStyle = '#f5f8ff';
      x.fillRect(0, 0, 1920, 1080);

      // 타이틀
      x.fillStyle = '#1a73e8';
      x.font = 'bold 48px sans-serif';
      x.fillText('MY OKR', 120, 110);

      // 카드 렌더링
      a.forEach((g, i) => {
        let y = 180 + i * 175;
        x.fillStyle = '#fff';
        x.fillRect(100, y, 1720, 145);

        // 목표 (Objective)
        x.fillStyle = '#202124';
        x.font = 'bold 31px sans-serif';
        x.fillText(g.objective.slice(0, 55), 140, y + 47);

        // 목표 기간 (Period)
        if (g.startDate && g.endDate) {
          x.fillStyle = '#5f6368';
          x.font = '20px sans-serif';
          x.textAlign = 'right';
          x.fillText(g.startDate + ' – ' + g.endDate, 1780, y + 47);
          x.textAlign = 'left';
        }

        // Key Results
        x.font = '22px sans-serif';
        x.fillStyle = '#1a73e8';
        x.fillText(g.krs.map((k, n) => 'KR' + (n + 1) + ': ' + k).join('  ·  ').slice(0, 130), 140, y + 96);
      });

      let d = new Date();
      let ds = [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-');
      let filename = ds + '_OKR.png';

      // 1. Canvas to Blob 변환
      let blob = await new Promise(resolve => {
        if (c.toBlob) {
          c.toBlob(resolve, 'image/png');
        } else {
          let binStr = atob(c.toDataURL('image/png').split(',')[1]);
          let len = binStr.length, arr = new Uint8Array(len);
          for (let i = 0; i < len; i++) arr[i] = binStr.charCodeAt(i);
          resolve(new Blob([arr], { type: 'image/png' }));
        }
      });

      if (!blob) {
        alert(lang === 'ko' ? '이미지 생성에 실패했습니다.' : 'Failed to generate image.');
        return;
      }

      // 2. 모바일 Web Share API 지원 확인 (iOS Safari, Android Chrome 등 사진 저장 및 공유)
      let isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if (isMobile && navigator.canShare) {
        try {
          let file = new File([blob], filename, { type: 'image/png' });
          if (navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              title: 'MY OKR'
            });
            $('#picker').classList.remove('open');
            return;
          }
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }

      // 3. 데스크톱 및 일반 브라우저 다운로드 (Blob URL + <a> 클릭)
      let u = URL.createObjectURL(blob);
      let l = document.createElement('a');
      l.href = u;
      l.download = filename;
      l.target = '_blank';
      document.body.appendChild(l);
      l.click();
      document.body.removeChild(l);
      setTimeout(() => URL.revokeObjectURL(u), 10000);
      $('#picker').classList.remove('open');
    };

    // JSON 내보내기 (Export)
    $('#exp').onclick = () => {
      let d = new Date();
      let ds = [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-');
      let b = new Blob([JSON.stringify(get(), null, 2)], { type: 'application/json' });
      let u = URL.createObjectURL(b);
      let l = document.createElement('a');
      l.href = u;
      l.download = ds + '_OKR_backup.json';
      document.body.appendChild(l);
      l.click();
      document.body.removeChild(l);
      setTimeout(() => URL.revokeObjectURL(u), 3000);
    };

    // JSON 가져오기 (Import)
    let tempImport = [];
    $('#imp').onclick = () => $('#file').click();

    $('#file').onchange = e => {
      let f = e.target.files[0];
      if (!f) return;
      let r = new FileReader();
      r.onload = ev => {
        try {
          let d = JSON.parse(ev.target.result);
          if (!Array.isArray(d)) throw 0;
          tempImport = d;
          $('#imp-modal').classList.add('open');
        } catch (x) {
          alert(lang === 'ko' ? '올바른 JSON 파일이 아닙니다.' : 'Invalid JSON file.');
        }
        e.target.value = '';
      };
      r.readAsText(f);
    };

    // 가져오기: 덮어씌우기
    $('#imp-replace').onclick = () => {
      put(tempImport);
      render();
      $('#imp-modal').classList.remove('open');
      alert(lang === 'ko' ? '성공적으로 덮어씌웠습니다.' : 'Data replaced successfully.');
    };

    // 가져오기: 추가하기
    $('#imp-append').onclick = () => {
      let cur = get();
      let exist = new Set(cur.map(x => String(x.id)));
      tempImport.forEach(item => {
        if (exist.has(String(item.id))) item.id = Date.now() + Math.random();
        cur.push(item);
      });
      put(cur);
      render();
      $('#imp-modal').classList.remove('open');
      alert(lang === 'ko' ? '성공적으로 추가되었습니다.' : 'Data appended successfully.');
    };

    // 목표 기간 프리셋 버튼
    document.querySelectorAll('.preset').forEach(b => {
      b.onclick = () => {
        let f = $('#form');
        let sVal = f.startDate.value || new Date().toLocaleDateString('sv');
        f.startDate.value = sVal;
        let [y, m, d] = sVal.split('-').map(Number);
        let dt = new Date(y, m - 1, d);
        let p = b.dataset.p;

        if (p === '1w') dt.setDate(dt.getDate() + 7);
        else if (p === '1m') dt.setMonth(dt.getMonth() + 1);
        else if (p === '3m') dt.setMonth(dt.getMonth() + 3);
        else if (p === '1y') dt.setFullYear(dt.getFullYear() + 1);

        f.endDate.value = dt.toLocaleDateString('sv');
      };
    });

    // 초기 실행
    words();
  </script>
</body>
</html>
